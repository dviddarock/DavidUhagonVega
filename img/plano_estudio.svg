<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#ffffff"/>
  <!-- paredes -->
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="#000" stroke-width="4"/>
  <line x1="420" y1="20" x2="420" y2="430" stroke="#000" stroke-width="4"/>
  <!-- puerta -->
  <line x1="700" y1="430" x2="760" y2="430" stroke="#fff" stroke-width="6"/>
  <path d="M700 430 A60 60 0 0 1 760 370" fill="none" stroke="#888" stroke-width="2"/>
  <text x="730" y="415" font-family="Arial" font-size="12" fill="#555" text-anchor="middle">puerta</text>
  <!-- cristal -->
  <rect x="415" y="170" width="10" height="100" fill="#78b4ff"/>
  <text x="420" y="160" font-family="Arial" font-size="13" fill="#2860c8" text-anchor="middle">cristal</text>

  <text x="220" y="55" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">LOCUTORIO</text>
  <text x="600" y="55" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">CONTROL</text>

  <!-- locutorio -->
  <rect x="110" y="180" width="220" height="80" fill="#f3f3f3" stroke="#555" stroke-width="3"/>
  <text x="220" y="225" font-family="Arial" font-size="15" text-anchor="middle">Mesa de locutores</text>
  <g fill="#c81e1e">
    <circle cx="150" cy="160" r="11"/><circle cx="290" cy="160" r="11"/>
    <circle cx="150" cy="280" r="11"/><circle cx="290" cy="280" r="11"/>
  </g>
  <text x="220" y="330" font-family="Arial" font-size="13" fill="#c81e1e" text-anchor="middle">4 micrófonos con auriculares</text>
  <text x="220" y="395" font-family="Arial" font-size="12" fill="#888" text-anchor="middle">paneles acústicos en las paredes</text>

  <!-- control -->
  <rect x="470" y="170" width="260" height="110" fill="#f3f3f3" stroke="#555" stroke-width="3"/>
  <rect x="490" y="190" width="100" height="70" rx="6" fill="#222"/>
  <text x="540" y="230" font-family="Arial" font-size="11" fill="#fff" text-anchor="middle">RØDECaster</text>
  <text x="540" y="244" font-family="Arial" font-size="11" fill="#fff" text-anchor="middle">Pro</text>
  <rect x="605" y="195" width="70" height="45" rx="3" fill="#9aa0a6"/>
  <text x="640" y="222" font-family="Arial" font-size="10" text-anchor="middle">MacBook</text>
  <rect x="685" y="200" width="32" height="44" rx="4" fill="#5f6368"/>
  <text x="701" y="270" font-family="Arial" font-size="10" text-anchor="middle">iPad</text>
  <text x="600" y="305" font-family="Arial" font-size="15" text-anchor="middle">Mesa de control</text>
  <!-- monitores -->
  <rect x="470" y="120" width="30" height="40" fill="#444"/>
  <rect x="700" y="120" width="30" height="40" fill="#444"/>
  <text x="600" y="145" font-family="Arial" font-size="12" fill="#444" text-anchor="middle">monitores</text>
  <!-- roseta -->
  <rect x="765" y="340" width="12" height="20" fill="#2e7d32"/>
  <text x="755" y="355" font-family="Arial" font-size="11" fill="#2e7d32" text-anchor="end">roseta RJ45</text>
</svg>
