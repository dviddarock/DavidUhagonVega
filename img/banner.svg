<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b3d"/>
      <stop offset="0.55" stop-color="#5b1a8b"/>
      <stop offset="1" stop-color="#d6336c"/>
    </linearGradient>
    <linearGradient id="barras" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb703"/>
      <stop offset="1" stop-color="#fb5607"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa0a6"/>
      <stop offset="0.5" stop-color="#f1f3f4"/>
      <stop offset="1" stop-color="#80868b"/>
    </linearGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="puntos" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- fondo -->
  <rect width="1000" height="300" rx="20" fill="url(#fondo)"/>
  <rect width="1000" height="300" rx="20" fill="url(#puntos)"/>
  <circle cx="160" cy="150" r="210" fill="#ffffff" opacity="0.04"/>
  <circle cx="160" cy="150" r="150" fill="#ffffff" opacity="0.05"/>

  <!-- ondas que salen del micro -->
  <g fill="none" stroke="#ffb703" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <path d="M230 95 Q260 150 230 205">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M255 75 Q295 150 255 225">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M90 95 Q60 150 90 205">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M65 75 Q25 150 65 225">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- microfono -->
  <rect x="125" y="55" width="70" height="115" rx="35" fill="url(#metal)"/>
  <g stroke="#5f6368" stroke-width="2" opacity="0.6">
    <line x1="130" y1="80" x2="190" y2="80"/>
    <line x1="127" y1="100" x2="193" y2="100"/>
    <line x1="127" y1="120" x2="193" y2="120"/>
    <line x1="130" y1="140" x2="190" y2="140"/>
  </g>
  <path d="M108 130 Q108 200 160 200 Q212 200 212 130" fill="none" stroke="#f1f3f4" stroke-width="7" stroke-linecap="round"/>
  <rect x="155" y="200" width="10" height="35" fill="#f1f3f4"/>
  <rect x="125" y="232" width="70" height="10" rx="5" fill="#f1f3f4"/>

  <!-- piloto EN EL AIRE -->
  <g filter="url(#brillo)">
    <rect x="745" y="30" width="200" height="50" rx="10" fill="#e5383b">
      <animate attributeName="opacity" values="1;0.55;1" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="745" y="30" width="200" height="50" rx="10" fill="none" stroke="#ffffff" stroke-width="2"/>
  <circle cx="770" cy="55" r="7" fill="#ffffff"/>
  <text x="862" y="63" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">EN EL AIRE</text>

  <!-- textos -->
  <text x="320" y="128" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="bold" fill="#ffffff">Radio escolar</text>
  <text x="320" y="180" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="bold" fill="#ffb703">desde cero</text>
  <text x="322" y="218" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1e4ff">TFC · Sistemas de Telecomunicaciones e Informáticos</text>
  <rect x="322" y="236" width="190" height="30" rx="15" fill="#ffffff" opacity="0.15"/>
  <text x="417" y="257" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">ARENAS SUR RADIO</text>
  <text x="530" y="257" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#f1e4ff">David Uhagón Vega</text>

  <!-- ecualizador -->
  <g fill="url(#barras)">
    <rect x="760" y="170" width="14" height="80" rx="4"><animate attributeName="height" values="80;30;80" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="170;220;170" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="782" y="140" width="14" height="110" rx="4"><animate attributeName="height" values="110;50;110" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="140;200;140" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="804" y="190" width="14" height="60" rx="4"><animate attributeName="height" values="60;120;60" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="190;130;190" dur="1s" repeatCount="indefinite"/></rect>
    <rect x="826" y="120" width="14" height="130" rx="4"><animate attributeName="height" values="130;60;130" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="120;190;120" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="848" y="160" width="14" height="90" rx="4"><animate attributeName="height" values="90;40;90" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="160;210;160" dur="0.8s" repeatCount="indefinite"/></rect>
    <rect x="870" y="180" width="14" height="70" rx="4"><animate attributeName="height" values="70;115;70" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="180;135;180" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="892" y="150" width="14" height="100" rx="4"><animate attributeName="height" values="100;45;100" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="150;205;150" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="914" y="200" width="14" height="50" rx="4"><animate attributeName="height" values="50;95;50" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="200;155;200" dur="0.95s" repeatCount="indefinite"/></rect>
  </g>
  <line x1="750" y1="252" x2="940" y2="252" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
</svg>
